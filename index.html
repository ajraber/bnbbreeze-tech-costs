<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BNB Breeze · Tech Costs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --brand: #00b0ec;
    --header-bg: #142832;
    --header-ink: #ffffff;
    --header-ink-2: rgba(255,255,255,0.72);
    --accent-contrast: #ffffff;
    --series-1: #1e7fb0;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --series-5: #e87ba4;
    --series-6: #008300;
    --status-good: #0ca30c;
    --status-warning: #fab219;
    --status-serious: #ec835a;
    --status-critical: #d03b3b;
    --delta-good: #006300;
    --wash-1: rgba(64,160,204,0.14);
    --accent: #1e7fb0;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --brand: #00b0ec;
      --header-bg: #0d171c;
      --header-ink: #ffffff;
      --header-ink-2: rgba(255,255,255,0.68);
      --accent-contrast: #06222e;
      --series-1: #3a9dc9;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --series-5: #d55181;
      --series-6: #008300;
      --delta-good: #0ca30c;
      --wash-1: rgba(58,157,201,0.16);
      --accent: #3a9dc9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --brand: #00b0ec;
    --header-bg: #0d171c;
    --header-ink: #ffffff;
    --header-ink-2: rgba(255,255,255,0.68);
    --accent-contrast: #06222e;
    --series-1: #3a9dc9;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #008300;
    --delta-good: #0ca30c;
    --wash-1: rgba(58,157,201,0.16);
    --accent: #3a9dc9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px; line-height: 1.45;
  }
  header.app {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 13px 24px; background: var(--header-bg);
    border-bottom: 3px solid var(--brand);
    position: sticky; top: 0; z-index: 40;
  }
  header.app h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -0.01em;
    color: var(--header-ink); display: flex; align-items: center; gap: 10px;
    font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif; }
  header.app h1 img { height: 26px; display: block; }
  header.app h1 .sub { color: var(--header-ink-2); font-weight: 500; }
  nav.tabs { display: flex; gap: 2px; margin-left: 8px; flex-wrap: wrap; }
  nav.tabs button {
    appearance: none; border: 0; background: transparent; color: var(--header-ink-2);
    font: inherit; padding: 7px 13px; border-radius: 7px; cursor: pointer; position: relative;
  }
  nav.tabs button:hover { background: rgba(255,255,255,0.12); color: var(--header-ink); }
  nav.tabs button.active { background: var(--brand); color: #06222e; font-weight: 600; }
  nav.tabs button .pill {
    display: inline-block; min-width: 17px; text-align: center; margin-left: 6px;
    background: var(--status-critical); color: #fff; border-radius: 9px;
    font-size: 11px; font-weight: 650; padding: 1px 5px; vertical-align: 1px;
  }
  .hdr-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .conn { font-size: 12px; color: var(--header-ink-2); display: flex; align-items: center; gap: 6px; }
  .conn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .conn.ok .dot { background: var(--status-good); }
  .conn.err .dot { background: var(--status-critical); }
  .theme-btn { border: 1px solid rgba(255,255,255,0.3); background: transparent; color: var(--header-ink-2);
    border-radius: 7px; padding: 6px 10px; cursor: pointer; font: inherit; font-size: 12px; }
  main { max-width: 1240px; margin: 0 auto; padding: 22px 24px 80px; }
  section.view { display: none; }
  section.view.active { display: block; }
  .banner {
    display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--border);
    border-left: 4px solid var(--status-warning); background: var(--surface-1);
    border-radius: 10px; padding: 12px 16px; margin-bottom: 18px;
  }
  .banner.critical { border-left-color: var(--status-critical); }
  .banner b { font-weight: 650; }
  .banner button { margin-left: auto; }
  .grid { display: grid; gap: 16px; }
  .tiles { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin-bottom: 16px; }
  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px;
  }
  .card h3, section.view h3 { font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card h3 { margin: 0 0 2px; font-size: 13px; font-weight: 600; color: var(--text-secondary); }
  .card .sub { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  .tile .label { font-size: 12.5px; color: var(--text-secondary); }
  .tile .value { font-size: 26px; font-weight: 650; margin-top: 2px; letter-spacing: -0.01em; }
  .tile .value.hero { font-size: 48px; line-height: 1.1; }
  @media (min-width: 700px) { .tile.span2 { grid-column: span 2; } }
  .tile .delta { font-size: 12px; margin-top: 3px; color: var(--text-secondary); }
  .tile .delta .up-bad { color: var(--status-critical); font-weight: 600; }
  .tile .delta .ok { color: var(--delta-good); font-weight: 600; }
  .charts { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); align-items: start; }
  .chart-wrap { overflow: visible; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); margin: 2px 0 8px; }
  .legend .key { display: inline-flex; align-items: center; gap: 6px; }
  .legend .swatch { width: 10px; height: 10px; border-radius: 3px; }
  .legend .linekey { width: 14px; height: 2px; border-radius: 1px; }
  svg text { font-family: inherit; }
  .axis-label { font-size: 11px; fill: var(--muted); }
  .bar-label { font-size: 11.5px; fill: var(--text-secondary); }
  .bar-cat { font-size: 12px; fill: var(--text-primary); }
  #tooltip {
    position: fixed; z-index: 90; pointer-events: none; display: none;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 9px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.14); padding: 9px 12px; font-size: 12.5px; max-width: 280px;
  }
  #tooltip .t-title { color: var(--muted); font-size: 11.5px; margin-bottom: 4px; }
  #tooltip .t-row { display: flex; align-items: center; gap: 7px; margin: 2px 0; }
  #tooltip .t-row .k { width: 12px; height: 2px; border-radius: 1px; flex: 0 0 auto; }
  #tooltip .t-row .v { font-weight: 650; margin-left: auto; padding-left: 14px; }
  table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data th {
    text-align: left; font-weight: 550; color: var(--muted); font-size: 11.5px;
    text-transform: uppercase; letter-spacing: 0.04em;
    padding: 8px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap;
    cursor: pointer; user-select: none;
  }
  table.data td { padding: 8px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.data tbody tr:hover { background: var(--wash-1); }
  table.data tbody tr.clickable { cursor: pointer; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 550; border: 1px solid var(--border); }
  .badge.active { color: var(--delta-good); }
  .badge.under_review { color: var(--status-serious); }
  .badge.cancelled { color: var(--muted); text-decoration: line-through; }
  .badge.per_property { background: var(--wash-1); border: 0; }
  .badge.per_user { background: rgba(235,104,52,0.10); border: 0; }
  .badge.company_wide { background: rgba(27,175,122,0.12); border: 0; }
  .sev { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; font-size: 12px; }
  .sev::before { font-size: 12px; }
  .sev.critical { color: var(--status-critical); } .sev.critical::before { content: "⛔"; }
  .sev.warning { color: var(--status-serious); } .sev.warning::before { content: "⚠️"; }
  .sev.info { color: var(--accent); } .sev.info::before { content: "ℹ️"; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .seg { display: inline-flex; gap: 2px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 9px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: var(--text-secondary); font: inherit; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  .seg button.on { background: var(--text-primary); color: var(--surface-1); font-weight: 550; }
  input.seat-inline { width: 74px; font: inherit; padding: 4px 7px; border-radius: 6px; border: 1px solid var(--border); background: var(--page); color: var(--text-primary); text-align: right; }
  .unit-big { font-size: 20px; font-weight: 650; }
  .toolbar input[type="search"], .toolbar select, .toolbar input[type="month"], .toolbar input[type="text"] {
    font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-primary);
  }
  button.btn {
    font: inherit; padding: 8px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
  }
  button.btn:hover { background: var(--wash-1); }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); font-weight: 600; }
  button.btn.primary:disabled { opacity: 0.45; cursor: not-allowed; }
  button.btn.danger { color: var(--status-critical); }
  button.btn.small { padding: 4px 10px; font-size: 12.5px; }
  .drop {
    border: 2px dashed var(--baseline); border-radius: 14px; padding: 42px 20px;
    text-align: center; color: var(--text-secondary); background: var(--surface-1);
    transition: border-color .15s, background .15s; cursor: pointer;
  }
  .drop.over { border-color: var(--accent); background: var(--wash-1); }
  .drop .big { font-size: 17px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); z-index: 60;
    background: var(--surface-1); border-left: 1px solid var(--grid);
    box-shadow: -12px 0 40px rgba(0,0,0,0.12); padding: 20px 22px; overflow-y: auto;
    transform: translateX(105%); transition: transform .18s ease;
  }
  .drawer.open { transform: none; }
  .drawer h3 { margin-top: 0; }
  .drawer label { display: block; font-size: 12px; color: var(--text-secondary); margin: 12px 0 4px; }
  .drawer input, .drawer select, .drawer textarea {
    width: 100%; font: inherit; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--page); color: var(--text-primary);
  }
  .drawer textarea { min-height: 70px; resize: vertical; }
  .drawer .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .drawer .actions { display: flex; gap: 10px; margin-top: 18px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .mt0 { margin-top: 0; }
  .review-item { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: var(--surface-1); }
  .review-item .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .review-item .head .amt { margin-left: auto; font-weight: 650; font-variant-numeric: tabular-nums; }
  .review-item .detail { color: var(--text-secondary); font-size: 13px; margin: 6px 0 10px; }
  .review-item .decide { display: flex; gap: 8px; flex-wrap: wrap; }
  .review-item .decide button.sel-approve { background: var(--delta-good); color: #fff; border-color: transparent; }
  .review-item .decide button.sel-invest { background: var(--status-serious); color: #fff; border-color: transparent; }
  .flag-note { width: 100%; margin-top: 8px; font: inherit; padding: 6px 9px; border-radius: 7px; border: 1px solid var(--border); background: var(--page); color: var(--text-primary); display: none; }
  .steps { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); margin-bottom: 16px; flex-wrap: wrap; }
  .steps .step { display: flex; gap: 6px; align-items: center; }
  .steps .n { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--baseline); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }
  .steps .step.on { color: var(--text-primary); font-weight: 550; }
  .steps .step.on .n { background: var(--accent); border-color: var(--accent); color: #fff; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
  dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--surface-1); color: var(--text-primary); max-width: 460px; padding: 20px 22px; }
  dialog::backdrop { background: rgba(0,0,0,0.35); }
  footer.app { text-align: center; color: rgba(255,255,255,0.6); font-size: 12px; padding: 22px;
    background: var(--header-bg); border-top: 3px solid var(--brand); margin-top: 40px; }
  @media print { .drop, nav.tabs, .toolbar, .theme-btn { display: none !important; } }
</style>
</head>

<script>
"use strict";
/* ================= CONFIG ================= */
const SUPA_URL = "https://zyyzmkayzadbhazdoghk.supabase.co";
const SUPA_KEY = "sb_publishable_qbLZZGhuGRPYgoafkI2tiw_GrxFaHW8";
const REST = SUPA_URL + "/rest/v1/";

/* ================= API ================= */
async function api(path, opts = {}) {
  const headers = Object.assign({
    "apikey": SUPA_KEY,
    "Authorization": "Bearer " + SUPA_KEY,
    "Content-Type": "application/json"
  }, opts.headers || {});
  const res = await fetch(REST + path, Object.assign({}, opts, { headers }));
  if (!res.ok) {
    const txt = await res.text();
    throw new Error("API " + res.status + ": " + txt.slice(0, 300));
  }
  if (res.status === 204) return null;
  const t = await res.text();
  return t ? JSON.parse(t) : null;
}
const apiGet = (p) => api(p);
const apiPost = (p, body) => api(p, { method: "POST", body: JSON.stringify(body), headers: { "Prefer": "return=representation" } });
const apiPatch = (p, body) => api(p, { method: "PATCH", body: JSON.stringify(body), headers: { "Prefer": "return=representation" } });
const apiDelete = (p) => api(p, { method: "DELETE" });

/* ================= STATE ================= */
const S = {
  subs: [], flags: [], actuals: [], batches: [], settings: {}, log: [],
  actor: "", view: "overview",
  regFilter: { q: "", dept: "", alloc: "", status: "" },
  regSort: { col: "budget_2026", dir: -1 },
  pendingUpload: null
};
const fmt$ = (n, dp = 0) => n == null ? "—" : n.toLocaleString("en-US", { style: "currency", currency: "USD", minimumFractionDigits: dp, maximumFractionDigits: dp });
const fmtC = (n) => n == null ? "—" : ("$" + compact(n));
function compact(n) {
  const a = Math.abs(n);
  if (a >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (a >= 10000) return (n / 1e3).toFixed(1) + "K";
  return n.toLocaleString("en-US", { maximumFractionDigits: 0 });
}
const esc = (s) => { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; };
const el = (id) => document.getElementById(id);
const monthName = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("en-US", { month: "short", year: "numeric" });
const todayISO = () => { const d = new Date(); return d.toISOString().slice(0, 10); };

async function loadAll() {
  const conn = el("conn"), txt = el("connTxt");
  try {
    const [subs, flags, actuals, batches, settings, log] = await Promise.all([
      apiGet("tc_subscriptions?select=*&order=qb_account_code"),
      apiGet("tc_audit_flags?select=*&order=created_at.desc"),
      apiGet("tc_monthly_actuals?select=*&order=period_month"),
      apiGet("tc_upload_batches?select=*&order=uploaded_at.desc"),
      apiGet("tc_settings?select=*"),
      apiGet("tc_activity_log?select=*&order=at.desc&limit=40")
    ]);
    S.subs = subs; S.flags = flags; S.actuals = actuals; S.batches = batches; S.log = log;
    S.settings = {}; settings.forEach(r => S.settings[r.key] = r.value);
    conn.className = "conn ok"; txt.textContent = "live";
  } catch (e) {
    conn.className = "conn err"; txt.textContent = "offline";
    console.error(e);
    throw e;
  }
}
const setting = (k, d) => S.settings[k] != null ? S.settings[k] : d;
const numSetting = (k, d) => { const v = parseFloat(S.settings[k]); return isNaN(v) ? d : v; };

/* Derived helpers */
function committedActuals() {
  const committedBatch = new Set(S.batches.filter(b => b.status === "committed").map(b => b.id));
  return S.actuals.filter(a => !a.batch_id || committedBatch.has(a.batch_id));
}
function ytdFor(sub) {
  const rows = committedActuals().filter(a => a.subscription_id === sub.id);
  if (rows.length) return rows.reduce((s, a) => s + Number(a.amount), 0);
  return sub.ytd_2026_seed != null ? Number(sub.ytd_2026_seed) : null;
}
function hasLiveActuals() { return committedActuals().length > 0; }
function openFlags() { return S.flags.filter(f => f.status === "open" || f.status === "investigating"); }
/* Monthly cost: annual-billed → annual ÷ 12; otherwise actual YTD ÷ months elapsed; fallback budget ÷ 12 */
function monthlyCostOf(s) {
  const me = monthsElapsedFY();
  const y = ytdFor(s);
  if (s.billing_frequency === "annual") {
    if (y != null && y > 0) return y / 12;
    return s.budget_2026 > 0 ? Number(s.budget_2026) / 12 : (y === 0 ? 0 : null);
  }
  if (y != null && y > 0) return y / me;
  if (s.budget_2026 > 0) return Number(s.budget_2026) / 12;
  return y === 0 ? 0 : null;
}

<script>
"use strict";
/* ================= TOOLTIP ================= */
const tip = el("tooltip");
function showTip(evt, html) {
  tip.innerHTML = html; tip.style.display = "block";
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + w > innerWidth - 8) x = evt.clientX - w - pad;
  if (y + h > innerHeight - 8) y = evt.clientY - h - pad;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.style.display = "none"; }
function tipRow(color, label, value) {
  return '<div class="t-row"><span class="k" style="background:' + color + '"></span><span>' + esc(label) + '</span><span class="v">' + esc(value) + "</span></div>";
}

/* ================= SVG CHART HELPERS =================
   Specs: bars ≤24px w/ 4px rounded data-end (square baseline), 2px lines,
   ≥8px markers with 2px surface ring, hairline solid grid, text in ink tokens. */
const SNS = "http://www.w3.org/2000/svg";
function sEl(tag, attrs, parent) {
  const e = document.createElementNS(SNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p;
  return 10 * p;
}
/* Horizontal bar with rounded RIGHT end (data end), square left (baseline). */
function hBarPath(x, y, w, h, r) {
  if (w <= 0.5) return "M" + x + " " + y + "h0";
  r = Math.min(r, w, h / 2);
  return "M" + x + " " + y + " h" + (w - r) + " a" + r + " " + r + " 0 0 1 " + r + " " + r +
    " v" + (h - 2 * r) + " a" + r + " " + r + " 0 0 1 " + (-r) + " " + r + " h" + (r - w) + " z";
}
/* Grouped/simple horizontal bar chart.
   rows: [{label, values:[..], meta}], series: [{name,color}] */
function hBars(container, rows, series, opts = {}) {
  container.innerHTML = "";
  const labelW = opts.labelW || 150, valueW = 58;
  const barH = Math.min(opts.barH || 16, 24), gap = 2, groupPad = opts.groupPad || 10;
  const groupH = series.length * barH + (series.length - 1) * gap + groupPad;
  const W = container.clientWidth || 480;
  const plotW = W - labelW - valueW - 8;
  const H = rows.length * groupH + 24;
  const maxV = niceMax(Math.max(1, ...rows.flatMap(r => r.values.map(v => v || 0))));
  const svg = sEl("svg", { width: "100%", height: H, viewBox: "0 0 " + W + " " + H });
  container.appendChild(svg);
  // hairline gridlines at 0, 50, 100%
  [0, 0.5, 1].forEach(fr => {
    const gx = labelW + fr * plotW;
    sEl("line", { x1: gx, y1: 4, x2: gx, y2: H - 20, stroke: "var(--grid)", "stroke-width": 1 }, svg);
    const t = sEl("text", { x: gx, y: H - 6, "text-anchor": fr === 0 ? "start" : "middle", class: "axis-label" }, svg);
    t.textContent = "$" + compact(maxV * fr);
  });
  rows.forEach((row, ri) => {
    const y0 = ri * groupH + 4;
    const cat = sEl("text", { x: labelW - 10, y: y0 + (groupH - groupPad) / 2 + 4, "text-anchor": "end", class: "bar-cat" }, svg);
    cat.textContent = row.label.length > 22 ? row.label.slice(0, 21) + "…" : row.label;
    if (row.label.length > 22) { const tt = sEl("title", {}, cat); tt.textContent = row.label; }
    series.forEach((s, si) => {
      const v = row.values[si] || 0;
      const bw = (v / maxV) * plotW;
      const by = y0 + si * (barH + gap);
      const p = sEl("path", { d: hBarPath(labelW, by, bw, barH, 4), fill: s.color }, svg);
      // hit target bigger than the mark
      const hit = sEl("rect", { x: labelW, y: by - gap, width: plotW, height: barH + 2 * gap, fill: "transparent" }, svg);
      const html = '<div class="t-title">' + esc(row.label) + "</div>" +
        series.map((ss, i) => tipRow(ss.color, ss.name, fmt$(row.values[i], 2))).join("");
      [p, hit].forEach(t => {
        t.addEventListener("pointermove", e => { showTip(e, html); p.style.filter = "brightness(1.12)"; });
        t.addEventListener("pointerleave", () => { hideTip(); p.style.filter = ""; });
      });
      // value label at the tip (selective: always for single series; else only series the story is about = first)
      if (series.length === 1 || si === (opts.labelSeries != null ? opts.labelSeries : -1)) {
        const lbl = sEl("text", { x: labelW + bw + 6, y: by + barH - 4, class: "bar-label" }, svg);
        lbl.textContent = "$" + compact(v);
      }
    });
  });
  return svg;
}
/* Single stacked horizontal bar (part-to-whole, ≤6 segments, 2px surface gaps) */
function stackBar(container, parts, opts = {}) {
  container.innerHTML = "";
  const W = container.clientWidth || 480, H = 64, barH = 22, y = 8;
  const total = parts.reduce((s, p) => s + p.value, 0) || 1;
  const svg = sEl("svg", { width: "100%", height: H, viewBox: "0 0 " + W + " " + H });
  container.appendChild(svg);
  let x = 0;
  parts.forEach((p, i) => {
    const w = (p.value / total) * W;
    const gx = i === 0 ? x : x + 2;               // 2px surface gap between fills
    const gw = Math.max(0, w - (i === 0 ? 0 : 2));
    const r = sEl("rect", { x: gx, y, width: gw, height: barH, rx: 4, fill: p.color }, svg);
    const pct = (p.value / total * 100);
    const html = '<div class="t-title">Allocation</div>' + tipRow(p.color, p.label, fmt$(p.value, 0) + " · " + pct.toFixed(1) + "%");
    r.addEventListener("pointermove", e => { showTip(e, html); r.style.filter = "brightness(1.12)"; });
    r.addEventListener("pointerleave", () => { hideTip(); r.style.filter = ""; });
    // in-segment label only when it fits
    const txt = p.label + " " + pct.toFixed(0) + "%";
    if (gw > txt.length * 6.6 + 16) {
      const t = sEl("text", { x: gx + 8, y: y + barH - 7, style: "font-size:11.5px;font-weight:600", fill: "#fff" }, svg);
      t.textContent = txt;
    }
    x += w;
  });
  return svg;
}
/* Line chart for monthly trend. seriesArr: [{name,color,points:[{x label, y}]}] */
function lineChart(container, labels, seriesArr, opts = {}) {
  container.innerHTML = "";
  const W = container.clientWidth || 520, H = opts.h || 220;
  const padL = 46, padR = 14, padT = 10, padB = 26;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const maxV = niceMax(Math.max(1, ...seriesArr.flatMap(s => s.points)));
  const svg = sEl("svg", { width: "100%", height: H, viewBox: "0 0 " + W + " " + H });
  container.appendChild(svg);
  const xAt = i => labels.length === 1 ? padL + plotW / 2 : padL + (i / (labels.length - 1)) * plotW;
  const yAt = v => padT + plotH - (v / maxV) * plotH;
  [0, 0.5, 1].forEach(fr => {
    const gy = yAt(maxV * fr);
    sEl("line", { x1: padL, y1: gy, x2: W - padR, y2: gy, stroke: fr === 0 ? "var(--baseline)" : "var(--grid)", "stroke-width": 1 }, svg);
    const t = sEl("text", { x: padL - 8, y: gy + 4, "text-anchor": "end", class: "axis-label" }, svg);
    t.textContent = "$" + compact(maxV * fr);
  });
  labels.forEach((lb, i) => {
    const t = sEl("text", { x: xAt(i), y: H - 8, "text-anchor": "middle", class: "axis-label" }, svg);
    t.textContent = lb;
  });
  seriesArr.forEach(s => {
    if (labels.length > 1) {
      const d = s.points.map((v, i) => (i ? "L" : "M") + xAt(i) + " " + yAt(v)).join(" ");
      sEl("path", { d, fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
    }
    s.points.forEach((v, i) => {
      sEl("circle", { cx: xAt(i), cy: yAt(v), r: 5.5, fill: "var(--surface-1)" }, svg);      // 2px surface ring
      sEl("circle", { cx: xAt(i), cy: yAt(v), r: 4, fill: s.color }, svg);
    });
    // end label
    const li = s.points.length - 1;
    const t = sEl("text", { x: xAt(li) + 8, y: yAt(s.points[li]) + 4, class: "bar-label" }, svg);
    t.textContent = "$" + compact(s.points[li]);
  });
  // crosshair + unified tooltip
  const cross = sEl("line", { y1: padT, y2: padT + plotH, stroke: "var(--baseline)", "stroke-width": 1, visibility: "hidden" }, svg);
  const hit = sEl("rect", { x: padL, y: padT, width: plotW, height: plotH, fill: "transparent" }, svg);
  hit.addEventListener("pointermove", e => {
    const box = svg.getBoundingClientRect();
    const mx = (e.clientX - box.left) * (W / box.width);
    let bi = 0, bd = 1e9;
    labels.forEach((_, i) => { const d = Math.abs(xAt(i) - mx); if (d < bd) { bd = d; bi = i; } });
    cross.setAttribute("x1", xAt(bi)); cross.setAttribute("x2", xAt(bi));
    cross.setAttribute("visibility", "visible");
    showTip(e, '<div class="t-title">' + esc(labels[bi]) + "</div>" +
      seriesArr.map(s => tipRow(s.color, s.name, fmt$(s.points[bi], 2))).join(""));
  });
  hit.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); hideTip(); });
  return svg;
}
function legendHTML(series, mark) {
  return '<div class="legend">' + series.map(s =>
    '<span class="key"><span class="' + (mark === "line" ? "linekey" : "swatch") + '" style="background:' + s.color + '"></span>' + esc(s.name) + "</span>").join("") + "</div>";
}

/* ================= OVERVIEW ================= */
function renderOverview() {
  const v = el("view-overview");
  const live = hasLiveActuals();
  const act = committedActuals();
  const subs = S.subs.filter(s => s.status !== "cancelled");
  const budgetTotal = subs.reduce((s, x) => s + (Number(x.budget_2026) || 0), 0);
  const ytdTotal = subs.reduce((s, x) => s + (ytdFor(x) || 0), 0);
  const props = numSetting("property_count", 176);
  const users = numSetting("user_count", 15);
  const flags = openFlags();
  // Prorate against CALENDAR months elapsed in the fiscal year (not # of uploads)
  const fy = numSetting("fiscal_year", new Date().getFullYear());
  const monthsElapsed = fy < new Date().getFullYear() ? 12 :
    fy > new Date().getFullYear() ? 1 : Math.max(1, new Date().getMonth());
  const monthlyRun = ytdTotal / monthsElapsed;
  const prorated = budgetTotal * (monthsElapsed / 12);
  const vsBudget = prorated > 0 ? (ytdTotal / prorated - 1) * 100 : 0;

  let html = "";
  if (flags.length) {
    const nCrit = flags.filter(f => f.severity === "critical").length;
    html += '<div class="banner ' + (nCrit ? "critical" : "") + '">' +
      "<div><b>" + flags.length + " open audit item" + (flags.length > 1 ? "s" : "") + "</b> need review" +
      (nCrit ? " (" + nCrit + " critical)" : "") + ".</div>" +
      '<button class="btn small" onclick="go(\'audit\')">Review now →</button></div>';
  }
  html += '<div class="grid tiles">' +
    tile(fy + " tech spend (YTD)", fmt$(ytdTotal), deltaTxt(vsBudget), true) +
    tile("Annual budget", fmt$(budgetTotal), monthsElapsed + " mo elapsed" + (live ? "" : " · from seed sheet")) +
    tile("Monthly run rate", fmt$(monthlyRun), "avg over " + monthsElapsed + " months") +
    tile("Cost per property / mo", fmt$(monthlyRun / props, 2), props + " units") +
    tile("Active subscriptions", String(subs.filter(s => s.status === "active").length),
      S.subs.filter(s => s.status === "under_review").length + " under review") +
    "</div>";

  html += '<div class="grid charts">';
  html += '<div class="card"><h3>Spend by department</h3><p class="sub">2026 YTD actuals</p><div class="chart-wrap" id="ovDept"></div></div>';
  html += '<div class="card"><h3>Budget vs. actual — top subscriptions</h3><p class="sub">2026 YTD vs. prorated budget (' + monthsElapsed + '/12 of annual)</p><div id="ovTopLegend"></div><div class="chart-wrap" id="ovTop"></div></div>';
  html += '<div class="card"><h3>Allocation</h3><p class="sub">How costs scale — annual budget + new unbudgeted spend</p><div id="ovAllocLegend"></div><div class="chart-wrap" id="ovAlloc"></div>' +
    '<div class="small muted" id="ovAllocNote"></div></div>';
  html += '<div class="card"><h3>Monthly spend trend</h3><p class="sub" id="ovTrendSub"></p><div class="chart-wrap" id="ovTrend"></div></div>';
  html += "</div>";
  v.innerHTML = html;

  // Dept chart — one series, one color (slot 1)
  const deptMap = {};
  subs.forEach(s => { const y = ytdFor(s) || 0; deptMap[s.department] = (deptMap[s.department] || 0) + y; });
  const deptRows = Object.entries(deptMap).filter(([, val]) => val > 0).sort((a, b) => b[1] - a[1]);
  const top6 = deptRows.slice(0, 6);
  const other = deptRows.slice(6).reduce((s, [, val]) => s + val, 0);
  const rows = top6.map(([k, val]) => ({ label: k, values: [val] }));
  if (other > 0) rows.push({ label: "Other", values: [other] });
  hBars(el("ovDept"), rows, [{ name: "YTD spend", color: "var(--series-1)" }], { labelW: 150 });

  // Top subscriptions: budget (prorated) vs actual — 2 series with legend
  const topSubs = subs.map(s => ({ s, y: ytdFor(s) || 0 })).sort((a, b) => b.y - a.y).slice(0, 8);
  const twoSeries = [{ name: "YTD actual", color: "var(--series-1)" }, { name: "Prorated budget", color: "var(--series-2)" }];
  el("ovTopLegend").innerHTML = legendHTML(twoSeries);
  hBars(el("ovTop"), topSubs.map(t => ({
    label: t.s.name, values: [t.y, (Number(t.s.budget_2026) || 0) * monthsElapsed / 12]
  })), twoSeries, { barH: 12, groupPad: 8, labelSeries: -1 });

  // Allocation stacked bar
  const allocMap = { per_property: 0, per_user: 0, company_wide: 0 };
  subs.forEach(s => {
    const basis = Number(s.budget_2026) || ytdFor(s) || 0;   // budget where set, else YTD (new subs)
    allocMap[s.allocation] += basis;
  });
  const allocParts = [
    { label: "Per property", value: allocMap.per_property, color: "var(--series-1)" },
    { label: "Per user", value: allocMap.per_user, color: "var(--series-2)" },
    { label: "Company-wide", value: allocMap.company_wide, color: "var(--series-3)" }
  ];
  el("ovAllocLegend").innerHTML = legendHTML(allocParts.map(p => ({ name: p.label, color: p.color })));
  stackBar(el("ovAlloc"), allocParts);
  el("ovAllocNote").textContent = "Per property: " + fmt$(allocMap.per_property / props, 0) + "/unit/yr · Per user: " + fmt$(allocMap.per_user / users, 0) + "/person/yr (settings: " + props + " units, " + users + " users)";

  // Trend
  if (live) {
    const byMonth = {};
    act.forEach(a => { byMonth[a.period_month] = (byMonth[a.period_month] || 0) + Number(a.amount); });
    const months = Object.keys(byMonth).sort();
    el("ovTrendSub").textContent = "Committed monthly uploads";
    lineChart(el("ovTrend"), months.map(monthName), [{ name: "Tech spend", color: "var(--series-1)", points: months.map(m => byMonth[m]) }]);
  } else {
    el("ovTrendSub").textContent = "";
    el("ovTrend").innerHTML = '<div class="empty">No monthly uploads committed yet.<br>The trend line starts with your first QuickBooks upload in the <b>Monthly Audit</b> tab.</div>';
  }
}
function tile(label, value, delta, hero) {
  return '<div class="card tile' + (hero ? " span2" : "") + '"><div class="label">' + esc(label) + '</div><div class="value' + (hero ? " hero" : "") + '">' + esc(value) + "</div>" +
    (delta ? '<div class="delta">' + delta + "</div>" : "") + "</div>";
}
function deltaTxt(pct) {
  if (!isFinite(pct)) return "";
  const cls = pct > 2 ? "up-bad" : "ok";
  const arrow = pct > 0 ? "▲" : "▼";
  return '<span class="' + cls + '">' + arrow + " " + Math.abs(pct).toFixed(1) + "%</span> vs prorated budget";
}
</script>
<script>
"use strict";
/* ================= REGISTER ================= */
const DEPTS = ["Operations","Marketing","Finance","IT & Security","Revenue Management","Guest Experience","HR & Payroll","Productivity","Communications","AI Tools","Admin"];
const ALLOCS = { per_property: "Per property", per_user: "Per user", company_wide: "Company-wide" };
const FREQS = ["monthly","annual","usage","unknown"];
const STATUSES = ["active","under_review","cancelled"];

    if (typeof av === "string") return av.localeCompare(bv) * dir;
    return ((Number(av) || 0) - (Number(bv) || 0)) * dir;
  });
  let html = '<div class="toolbar">' +

    '<button class="btn primary" id="addSubBtn">+ Add subscription</button>' +

    "</div>";
  html += '<div class="card" style="padding:6px 8px;overflow-x:auto"><table class="data"><thead><tr>' +
    th("qb_account_code", "Code") + th("name", "Name") + th("department", "Dept") + th("category", "Category") +
    th("allocation", "Allocation") + th("billing_frequency", "Billing") + th("status", "Status") +
    th("budget_2026", "2026 budget", true) + th("monthly", "Monthly cost", true) + th("ytd", "2026 YTD", true) + th("actual_2025", "2025 actual", true) +
    "</tr></thead><tbody>";
  list.forEach(s => {
    const y = ytdFor(s);
    const pct = (s.budget_2026 > 0 && y != null) ? (y / s.budget_2026 * 100) : null;
    html += '<tr class="clickable" data-id="' + s.id + '"><td class="muted">' + esc(s.qb_account_code) + "</td>" +
      "<td><b>" + esc(s.name) + "</b>" + (s.notes ? ' <span class="muted" title="' + esc(s.notes) + '">✎</span>' : "") + "</td>" +
      "<td>" + esc(s.department) + "</td><td>" + esc(s.category) + "</td>" +
      '<td><span class="badge ' + s.allocation + '">' + ALLOCS[s.allocation] + "</span>" +
      (s.allocation === "per_user" ? ' <span class="muted small">' + (s.seat_count != null && s.seat_count > 0 ? s.seat_count + " seats" : "co. count") + "</span>" : "") + "</td>" +
      "<td>" + esc(s.billing_frequency) + "</td>" +
      '<td><span class="badge ' + s.status + '">' + s.status.replace("_", " ") + "</span></td>" +
      '<td class="num">' + fmt$(s.budget_2026 != null ? Number(s.budget_2026) : null) + "</td>" +
      '<td class="num"><b>' + fmt$(s.status === "cancelled" ? null : monthlyCostOf(s), 2) + "</b>" +
      (s.status !== "cancelled" && s.billing_frequency === "annual" ? ' <span class="muted small" title="annual charge ÷ 12">an/12</span>' : "") + "</td>" +
      '<td class="num">' + fmt$(y) + (pct != null ? ' <span class="muted small">' + pct.toFixed(0) + "%</span>" : "") + "</td>" +
      '<td class="num muted">' + fmt$(s.actual_2025 != null ? Number(s.actual_2025) : null) + "</td></tr>";
  });
  html += "</tbody></table></div>";
  const monthlyTotal = list.filter(s => s.status !== "cancelled").reduce((t, s) => t + (monthlyCostOf(s) || 0), 0);
  html += '<p class="small muted">' + list.length + " of " + S.subs.length + " subscriptions · combined monthly cost of listed: <b>" + fmt$(monthlyTotal, 2) + "</b> · click a row to edit · click a column header to sort</p>";
  v.innerHTML = html;
  el("regQ").addEventListener("input", e => { S.regFilter.q = e.target.value; renderRegister(); });
  el("regDept").addEventListener("change", e => { S.regFilter.dept = e.target.value; renderRegister(); });
  el("regAlloc").addEventListener("change", e => { S.regFilter.alloc = e.target.value; renderRegister(); });
  el("regStatus").addEventListener("change", e => { S.regFilter.status = e.target.value; renderRegister(); });
  el("addSubBtn").addEventListener("click", () => openEditor(null));
  el("regExport").addEventListener("click", exportRegister);
  v.querySelectorAll("tr.clickable").forEach(tr => tr.addEventListener("click", () => openEditor(tr.dataset.id)));
  v.querySelectorAll("th[data-col]").forEach(t => t.addEventListener("click", () => {

function th(col, label, num) { return '<th data-col="' + col + '"' + (num ? ' class="num"' : "") + ">" + label + (S.regSort.col === col ? (S.regSort.dir < 0 ? " ↓" : " ↑") : "") + "</th>"; }
function sel(id, opts, val, blankLabel, labelFn) {

    '<option value="' + esc(o) + '"' + (o === val ? " selected" : "") + ">" +
    (o === "" ? blankLabel : esc(labelFn ? labelFn(o) : o).replace("_", " ")) + "</option>").join("") + "</select>";
}

/* ---- Drawer editor ---- */
function openEditor(id) {
  const s = id ? S.subs.find(x => x.id === id) : null;
  const d = el("drawer");
  d.innerHTML = "<h3>" + (s ? "Edit subscription" : "Add subscription") + "</h3>" +
    '<div class="row2"><div><label>QuickBooks code</label><input id="edCode" value="' + esc(s ? s.qb_account_code : "655.") + '"' + (s ? " disabled" : "") + "></div>" +
    '<div><label>Name</label><input id="edName" value="' + esc(s ? s.name : "") + '"></div></div>' +

    '<div><label>Category</label><input id="edCat" value="' + esc(s ? s.category : "") + '"></div></div>' +
    '<div class="row2"><div><label>Allocation</label><select id="edAlloc">' + Object.keys(ALLOCS).map(x => '<option value="' + x + '"' + (s && s.allocation === x ? " selected" : "") + ">" + ALLOCS[x] + "</option>").join("") + "</select></div>" +
    '<div><label>Billing</label><select id="edFreq">' + FREQS.map(x => '<option' + (s && s.billing_frequency === x ? " selected" : "") + ">" + x + "</option>").join("") + "</select></div></div>" +

    '<div><label>&nbsp;</label><span class="small muted" id="edSeatsHint"></span></div></div>' +
    '<div class="row2"><div><label>Status</label><select id="edStatus">' + STATUSES.map(x => '<option value="' + x + '"' + (s && s.status === x ? " selected" : "") + ">" + x.replace("_", " ") + "</option>").join("") + "</select></div>" +
    '<div><label>Owner (person responsible)</label><input id="edOwner" value="' + esc(s ? s.owner_name || "" : "") + '"></div></div>' +
    '<div class="row2"><div><label>2026 budget ($/yr)</label><input id="edBudget" type="number" step="0.01" value="' + (s && s.budget_2026 != null ? s.budget_2026 : "") + '"></div>' +
    '<div><label>Renewal date</label><input id="edRenew" type="date" value="' + (s && s.renewal_date ? s.renewal_date : "") + '"></div></div>' +
    "<label>Notes</label><textarea id='edNotes'>" + esc(s ? s.notes || "" : "") + "</textarea>" +
    '<div class="actions"><button class="btn primary" id="edSave">Save</button>' +
    '<button class="btn" id="edCancel">Cancel</button>' +
    (s ? '<button class="btn danger" id="edDelete" style="margin-left:auto">Delete</button>' : "") + "</div>" +

    d.classList.remove("open");
    await refresh();

}
async function logAct(action, detail) {
  try { await apiPost("tc_activity_log", { actor: S.actor || "dashboard user", action, detail }); } catch (e) { console.warn(e); }
}
function exportRegister() {
  const cols = ["qb_account_code","name","department","category","allocation","seat_count","billing_frequency","status","owner_name","renewal_date","actual_2025","budget_2026","monthly_cost","ytd_2026"];
  const rows = S.subs.map(s => [s.qb_account_code, s.name, s.department, s.category, s.allocation, s.seat_count ?? "", s.billing_frequency, s.status, s.owner_name || "", s.renewal_date || "", s.actual_2025 ?? "", s.budget_2026 ?? "", s.status === "cancelled" ? "" : (monthlyCostOf(s) != null ? monthlyCostOf(s).toFixed(2) : ""), ytdFor(s) ?? ""]);
  downloadCSV("bnbbreeze-subscription-register.csv", cols, rows);
}
function downloadCSV(filename, cols, rows) {
  const q = v => { v = v == null ? "" : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const csv = [cols.join(",")].concat(rows.map(r => r.map(q).join(","))).join("\r\n");
  const a = document.createElement("a");

<script>
"use strict";
/* ================= MONTHLY AUDIT ================= */
function renderAudit() {

    hist.map(b => "<tr><td><b>" + monthName(b.period_month) + "</b></td><td>" + esc(b.filename || "—") + "</td><td>" + esc(b.uploaded_by || "—") + "</td><td>" +
      new Date(b.uploaded_at).toLocaleDateString() + '</td><td class="num">' + (b.line_count ?? "—") + '</td><td class="num">' + fmt$(b.total_amount != null ? Number(b.total_amount) : null, 2) +

  v.innerHTML = html;

  const drop = el("drop"), fi = el("fileInput");

}
function defaultAuditMonth() {
  const d = new Date(); d.setMonth(d.getMonth() - 1);       // default: last month
  return d.toISOString().slice(0, 7);
}
async function resolveFlag(id, status) {
  const body = { status };
  if (status !== "investigating") { body.resolved_at = new Date().toISOString(); body.resolved_by = S.actor || "dashboard user"; }

/* ---- CSV parsing (QuickBooks-tolerant) ---- */
function parseCSV(text) {
  const rows = []; let row = [], cur = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cur); rows.push(row); row = []; cur = "";
    } else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
function parseAmount(s) {
  if (s == null) return null;
  s = String(s).trim().replace(/[$,\s]/g, "");
  if (!s) return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  const n = parseFloat(s);
  if (isNaN(n)) return null;
  return neg ? -n : n;
}
/* Extract subscription lines: any row whose first non-empty cell contains a 65x[.xx] code.
   Amount = rightmost parseable number in the row. Skips Total rows. */
function extractLines(rows) {
  const lines = [], skipped = [];
  rows.forEach(r => {
    const joined = r.join(" ").trim();
    if (!joined) return;
    const firstCell = (r.find(c => c && c.trim()) || "").trim();
    if (/^total\b/i.test(firstCell)) return;
    const m = firstCell.match(/^(\d{3}(?:\.\d{1,2})?)\b/);
    if (!m) { if (joined.length > 2) skipped.push(joined.slice(0, 80)); return; }
    let amount = null;
    for (let i = r.length - 1; i >= 1; i--) {
      const a = parseAmount(r[i]);
      if (a !== null && !/%/.test(r[i])) { amount = a; break; }
    }
    const name = firstCell.replace(/^\d{3}(?:\.\d{1,2})?\s*/, "").replace(/^Subscriptions?\s*-?\s*/i, "").trim();
    lines.push({ code: m[1], rawName: name || firstCell, amount });
  });
  return { lines, skipped };
}

/* ---- Audit engine ---- */
function analyzeUpload(lines, periodMonth) {
  const varPct = numSetting("variance_threshold_pct", 15);
  const budPct = numSetting("budget_threshold_pct", 110);
  const act = committedActuals();
  const items = [];   // {line, sub, flags:[{flag_type,severity,detail}]}
  const seen = {};
  const codesInFile = new Set();
  lines.forEach(line => {
    if (line.amount === null) return;   // header-ish rows
    const sub = S.subs.find(s => s.qb_account_code === line.code);
    const flags = [];
    if (seen[line.code]) flags.push({ flag_type: "duplicate_line", severity: "warning", detail: "Account " + line.code + " appears more than once in this file. Both amounts will be committed — verify that is intended." });
    seen[line.code] = true;
    codesInFile.add(line.code);
    if (!sub) {
      flags.push({ flag_type: "unmatched_account", severity: "critical", detail: "Account " + line.code + " (" + line.rawName + ") is not in the register. Add it as a subscription or fix the code before committing." });
    } else {
      if (sub.status === "cancelled" && line.amount > 0)
        flags.push({ flag_type: "other", severity: "critical", detail: sub.name + " is marked CANCELLED but was charged " + fmt$(line.amount, 2) + " this month. Zombie subscription — chase a refund or reactivate the register entry." });
      // price change vs prior committed month (or budget/12 baseline)
      const prior = act.filter(a => a.subscription_id === sub.id && a.period_month < periodMonth)
        .sort((a, b) => b.period_month.localeCompare(a.period_month))[0];
      const baseline = prior ? Number(prior.amount) : (sub.billing_frequency === "monthly" && sub.budget_2026 > 0 ? sub.budget_2026 / 12 : null);
      const baseLbl = prior ? "prior month (" + monthName(prior.period_month) + ")" : "budget baseline (annual ÷ 12)";
      if (baseline != null && baseline > 0 && line.amount > 0) {
        const chg = (line.amount - baseline) / baseline * 100;
        if (chg >= varPct) flags.push({ flag_type: "price_increase", severity: chg >= 2 * varPct ? "critical" : "warning", detail: sub.name + " is " + fmt$(line.amount, 2) + ", up " + chg.toFixed(0) + "% vs " + baseLbl + " (" + fmt$(baseline, 2) + "). Price hike, added seats, or double charge?" });
        else if (chg <= -varPct) flags.push({ flag_type: "price_decrease", severity: "info", detail: sub.name + " is " + fmt$(line.amount, 2) + ", down " + Math.abs(chg).toFixed(0) + "% vs " + baseLbl + " (" + fmt$(baseline, 2) + "). Confirm the drop is expected (seats removed, credit, etc.)." });
      }
      // over budget YTD
      if (sub.budget_2026 > 0) {
        const ytdPrev = act.filter(a => a.subscription_id === sub.id && a.period_month < periodMonth).reduce((s, a) => s + Number(a.amount), 0);
        const monthNum = parseInt(periodMonth.slice(5, 7), 10);
        const prorated = sub.budget_2026 * monthNum / 12;
        const newYtd = ytdPrev + line.amount;
        if (prorated > 0 && newYtd / prorated * 100 >= budPct)
          flags.push({ flag_type: "over_budget", severity: "warning", detail: sub.name + " YTD reaches " + fmt$(newYtd, 2) + " = " + (newYtd / prorated * 100).toFixed(0) + "% of prorated budget (" + fmt$(prorated, 0) + " through month " + monthNum + ")." });
      }
    }
    items.push({ line, sub, flags });
  });
  // missing charges: active monthly subs with history/seed but absent from file
  S.subs.filter(s => s.status === "active" && s.billing_frequency === "monthly" && !codesInFile.has(s.qb_account_code)).forEach(s => {
    const hadSpend = (ytdFor(s) || 0) > 0;
    if (hadSpend) items.push({
      line: { code: s.qb_account_code, rawName: s.name, amount: null },
      sub: s,
      flags: [{ flag_type: "missing_charge", severity: "warning", detail: s.name + " (monthly, active) has no line in this upload. Billing may have failed, moved to another account, or the export missed it. No amount will be committed." }]
    });
  });
  return items;
}

/* ---- Review UI ---- */
function handleFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const { lines, skipped } = extractLines(parseCSV(String(reader.result)));
    const monthVal = el("auMonth").value;
    if (!monthVal) { alert("Pick the month this file covers first."); return; }
    const periodMonth = monthVal + "-01";
    const withAmt = lines.filter(l => l.amount !== null);
    if (!withAmt.length) {
      el("reviewArea").innerHTML = '<div class="banner critical"><div><b>No subscription lines found.</b> I looked for rows starting with an account code like 655.17 with a dollar amount. Check that this is the QuickBooks export (Profit &amp; Loss detail or account list for the 655 accounts).</div></div>';
      return;
    }
    const items = analyzeUpload(withAmt, periodMonth);
    S.pendingUpload = { filename: file.name, periodMonth, items, decisions: {}, notes: {} };
    renderReview();
  };
  reader.readAsText(file);
}
function renderReview() {
  const P = S.pendingUpload;
  const area = el("reviewArea");
  const flagged = P.items.filter(i => i.flags.length);
  const clean = P.items.filter(i => !i.flags.length);
  const total = P.items.reduce((s, i) => s + (i.line.amount || 0), 0);
  const already = S.batches.find(b => b.status === "committed" && b.period_month === P.periodMonth);
  let html = '<div class="card" style="margin-top:16px"><h3 class="mt0">Review — ' + esc(P.filename) + " → <b>" + monthName(P.periodMonth) + "</b></h3>" +
    '<p class="sub">' + P.items.filter(i => i.line.amount !== null).length + " lines · " + fmt$(total, 2) + " total · " +
    flagged.length + " abnormalit" + (flagged.length === 1 ? "y" : "ies") + ", " + clean.length + " clean</p>";
  if (already) html += '<div class="banner critical"><div><b>' + monthName(P.periodMonth) + " is already committed.</b> Committing again will REPLACE that month's numbers (the old batch is discarded).</div></div>";
  if (!flagged.length) html += '<div class="banner" style="border-left-color:var(--status-good)"><div><b>No abnormalities.</b> Everything matches the register within your thresholds. Commit when ready.</div></div>';
  html += flagged.map((it, idx) => {
    const i = P.items.indexOf(it);
    const worst = it.flags.some(f => f.severity === "critical") ? "critical" : it.flags.some(f => f.severity === "warning") ? "warning" : "info";
    return '<div class="review-item" id="ri' + i + '"><div class="head">' +
      '<span class="sev ' + worst + '">' + worst + "</span>" +
      "<b>" + esc(it.sub ? it.sub.name : it.line.rawName) + "</b>" +
      '<span class="muted small">' + esc(it.line.code) + "</span>" +
      '<span class="amt">' + (it.line.amount === null ? "no charge" : fmt$(it.line.amount, 2)) + "</span></div>" +
      it.flags.map(f => '<div class="detail">' + esc(f.detail) + "</div>").join("") +
      '<div class="decide">' +
      '<button class="btn small" data-i="' + i + '" data-d="approve">✓ Approve — expected</button>' +
      '<button class="btn small" data-i="' + i + '" data-d="investigate">? Commit but keep flag open</button>' +
      (it.flags.some(f => f.flag_type === "unmatched_account") ? '<button class="btn small" data-i="' + i + '" data-d="add">+ Add to register</button>' : "") +
      (it.line.amount !== null ? '<button class="btn small danger" data-i="' + i + '" data-d="exclude">✕ Exclude line</button>' : "") +
      "</div>" +
      '<input class="flag-note" id="note' + i + '" placeholder="note (why is this OK / what are you checking?)"></div>';
  }).join("");
  if (clean.length) html += '<details style="margin-top:10px"><summary class="muted small">' + clean.length + " clean lines (auto-approved)</summary><table class='data'><tbody>" +
    clean.map(it => "<tr><td class='muted'>" + esc(it.line.code) + "</td><td>" + esc(it.sub ? it.sub.name : it.line.rawName) + "</td><td class='num'>" + fmt$(it.line.amount, 2) + "</td></tr>").join("") + "</tbody></table></details>";
  html += '<div class="actions" style="display:flex;gap:10px;margin-top:16px;align-items:center">' +
    '<button class="btn primary" id="commitBtn" disabled>Approve &amp; commit ' + monthName(P.periodMonth) + "</button>" +
    '<button class="btn" id="discardBtn">Discard upload</button>' +
    '<span class="small muted" id="commitMsg">Decide on every flagged item to enable commit.</span></div></div>';
  area.innerHTML = html;
  area.querySelectorAll(".decide button").forEach(b => b.addEventListener("click", () => decide(parseInt(b.dataset.i, 10), b.dataset.d, b)));
  area.querySelectorAll(".flag-note").forEach(n => {
    const i = n.id.replace("note", "");
    if (P.notes[i]) n.value = P.notes[i];
    n.addEventListener("input", () => P.notes[i] = n.value);
  });
  el("discardBtn").addEventListener("click", () => { S.pendingUpload = null; area.innerHTML = ""; });
  el("commitBtn").addEventListener("click", commitUpload);
  Object.entries(P.decisions).forEach(([i, d]) => applyDecisionUI(i, d));   // restore prior decisions
  updateCommitState();
}
function applyDecisionUI(i, d) {
  const item = el("ri" + i);
  if (!item) return;
  item.querySelectorAll(".decide button").forEach(x => x.classList.remove("sel-approve", "sel-invest"));
  const btn = item.querySelector('.decide button[data-d="' + (d === "approve" ? "approve" : d === "exclude" ? "exclude" : "investigate") + '"]');
  if (btn) btn.classList.add(d === "approve" ? "sel-approve" : "sel-invest");
  const note = el("note" + i);
  if (note) note.style.display = "block";
}
function decide(i, d, btn) {
  const P = S.pendingUpload;
  const it = P.items[i];
  if (d === "add") {
    // Prefill editor to add unmatched account, then re-analyze on save is complex — simplest: open editor prefilled
    openEditor(null);
    setTimeout(() => {
      el("edCode").value = it.line.code;
      el("edName").value = it.line.rawName;
    }, 50);
    return;
  }
  P.decisions[i] = d;
  applyDecisionUI(i, d);
  updateCommitState();
}
function updateCommitState() {
  const P = S.pendingUpload;
  if (!P) return;
  const flaggedIdx = P.items.map((it, i) => it.flags.length ? i : -1).filter(i => i >= 0);
  const done = flaggedIdx.every(i => P.decisions[i]);
  el("commitBtn").disabled = !done;
  el("commitMsg").textContent = done ? "All flagged items decided — ready to commit." :
    (flaggedIdx.filter(i => P.decisions[i]).length + " of " + flaggedIdx.length + " flagged items decided.");
}
async function commitUpload() {
  const P = S.pendingUpload;
  const btn = el("commitBtn");
  btn.disabled = true; btn.textContent = "Committing…";
  try {
    // Replace existing committed month if present
    const already = S.batches.filter(b => b.status === "committed" && b.period_month === P.periodMonth);
    for (const b of already) {
      await apiDelete("tc_monthly_actuals?batch_id=eq." + b.id);
      await apiPatch("tc_upload_batches?id=eq." + b.id, { status: "discarded", notes: "Replaced by re-upload on " + todayISO() });
    }
    const commitLines = P.items.filter((it, i) => it.line.amount !== null && P.decisions[i] !== "exclude");
    const totalAmt = commitLines.reduce((s, it) => s + it.line.amount, 0);
    const batch = (await apiPost("tc_upload_batches", {
      filename: P.filename, period_month: P.periodMonth, uploaded_by: S.actor || "dashboard user",
      status: "committed", line_count: commitLines.length, total_amount: totalAmt
    }))[0];
    // actuals
    const actualRows = commitLines.map(it => ({
      subscription_id: it.sub ? it.sub.id : null, qb_account_code: it.line.code,
      period_month: P.periodMonth, amount: it.line.amount, batch_id: batch.id
    }));
    if (actualRows.length) await apiPost("tc_monthly_actuals", actualRows);
    // flags
    const flagRows = [];
    P.items.forEach((it, i) => {
      if (!it.flags.length) return;
      const d = P.decisions[i];
      const note = (P.notes[i] || "").trim();
      it.flags.forEach(f => flagRows.push({
        batch_id: batch.id, subscription_id: it.sub ? it.sub.id : null, qb_account_code: it.line.code,
        flag_type: f.flag_type, severity: f.severity, detail: f.detail,
        status: d === "approve" ? "approved" : d === "exclude" ? "dismissed" : "open",
        resolution_note: note || (d === "exclude" ? "Line excluded from commit" : null),
        resolved_by: d === "approve" || d === "exclude" ? (S.actor || "dashboard user") : null,
        resolved_at: d === "approve" || d === "exclude" ? new Date().toISOString() : null
      }));
    });
    if (flagRows.length) await apiPost("tc_audit_flags", flagRows);
    await logAct("month_committed", monthName(P.periodMonth) + " · " + commitLines.length + " lines · " + fmt$(totalAmt, 2) + " · " + flagRows.filter(f => f.status === "open").length + " flags left open");
    S.pendingUpload = null;
    await refresh();
    go("audit");
    el("reviewArea").innerHTML = '<div class="banner" style="border-left-color:var(--status-good)"><div><b>' + monthName(P.periodMonth) + " committed.</b> " + commitLines.length + " lines, " + fmt$(totalAmt, 2) + ". Open items (if any) are listed below.</div></div>";
  } catch (e) {
    alert("Commit failed: " + e.message);
    btn.disabled = false; btn.textContent = "Approve & commit";
  }
}

<script>
"use strict";
/* ================= ANALYTICS ================= */
S.basis = "ytd";   // 'ytd' (annualized actuals) | 'budget'

function monthsElapsedFY() {
  const fy = numSetting("fiscal_year", new Date().getFullYear());
  return fy < new Date().getFullYear() ? 12 : fy > new Date().getFullYear() ? 1 : Math.max(1, new Date().getMonth());
}
function seatsFor(sub) {
  return (sub.seat_count != null && sub.seat_count > 0) ? Number(sub.seat_count) : numSetting("user_count", 15);
}
/* Annualized cost of a subscription under the chosen basis */
function annualCost(sub, me) {
  if (S.basis === "budget") return Number(sub.budget_2026) || 0;
  const y = ytdFor(sub);
  if (y == null) return 0;
  return y / me * 12;
}
function renderAnalytics() {
  const v = el("view-analytics");
  const me = monthsElapsedFY();
  const props = numSetting("property_count", 176);
  const users = numSetting("user_count", 15);
  const subs = S.subs.filter(s => s.status !== "cancelled");
  const withCost = subs.map(s => ({ s, annual: annualCost(s, me) })).filter(x => x.annual > 0);
  const total = withCost.reduce((a, x) => a + x.annual, 0);
  const byAlloc = { per_property: 0, per_user: 0, company_wide: 0 };
  withCost.forEach(x => byAlloc[x.s.allocation] += x.annual);
  const basisLabel = S.basis === "budget" ? "2026 annual budget" : "YTD actuals annualized (" + me + " months → 12)";

  let html = '<div class="toolbar"><span class="seg" id="basisSeg">' +
    '<button data-b="ytd" class="' + (S.basis === "ytd" ? "on" : "") + '">YTD actuals (annualized)</button>' +

    '<span class="small muted">Basis: ' + basisLabel + " · " + props + " properties · " + users + " employees (Settings)</span></div>";

  // KPI tiles
  html += '<div class="grid tiles">' +
    tile("Total tech cost / year", fmt$(total), basisLabel, true) +
    tile("Per property / month", fmt$(total / 12 / props, 2), "fully loaded · all tech ÷ " + props + " units") +
    tile("Per employee / month", fmt$(total / 12 / users, 2), "fully loaded · all tech ÷ " + users + " people") +
    tile("Per property (direct)", fmt$(byAlloc.per_property / 12 / props, 2), "/mo · property-scaling tools only") +
    "</div>";

  // Allocation summary
  html += '<div class="card" style="margin-bottom:16px"><h3>Where the money goes</h3><p class="sub">' + esc(basisLabel) + '</p>' +
    '<div style="overflow-x:auto"><table class="data"><thead><tr><th>Allocation</th><th class="num">Annual</th><th class="num">Monthly</th><th class="num">% of total</th><th>Unit economics</th></tr></thead><tbody>' +
    allocRow("Per property", byAlloc.per_property, total, fmt$(byAlloc.per_property / 12 / props, 2) + " per property / mo") +
    allocRow("Per user", byAlloc.per_user, total, fmt$(byAlloc.per_user / 12 / users, 2) + " avg per employee / mo") +
    allocRow("Company-wide", byAlloc.company_wide, total, fmt$(byAlloc.company_wide / 12 / users, 2) + " burden per employee / mo") +
    '<tr><td><b>Total</b></td><td class="num"><b>' + fmt$(total) + '</b></td><td class="num"><b>' + fmt$(total / 12) + '</b></td><td class="num">100%</td><td class="muted">' +
    fmt$(total / 12 / props, 2) + "/property/mo · " + fmt$(total / 12 / users, 2) + "/employee/mo</td></tr>" +
    "</tbody></table></div></div>";

  // Department breakdown chart + category table
  const deptMap = {};
  withCost.forEach(x => deptMap[x.s.department] = (deptMap[x.s.department] || 0) + x.annual);
  const catMap = {};
  withCost.forEach(x => { const k = x.s.category; (catMap[k] = catMap[k] || { dept: x.s.department, v: 0 }).v += x.annual; });
  html += '<div class="grid charts" style="margin-bottom:16px">' +
    '<div class="card"><h3>By department</h3><p class="sub">annual, ' + (S.basis === "budget" ? "budget" : "annualized") + '</p><div class="chart-wrap" id="anDept"></div></div>' +
    '<div class="card"><h3>By category</h3><p class="sub">top 10</p><div style="overflow-x:auto"><table class="data"><thead><tr><th>Category</th><th>Dept</th><th class="num">Annual</th><th class="num">/mo</th><th class="num">%</th></tr></thead><tbody>' +
    Object.entries(catMap).sort((a, b) => b[1].v - a[1].v).slice(0, 10).map(([k, o]) =>
      "<tr><td><b>" + esc(k) + "</b></td><td class='muted'>" + esc(o.dept) + '</td><td class="num">' + fmt$(o.v) + '</td><td class="num">' + fmt$(o.v / 12) + '</td><td class="num">' + (o.v / total * 100).toFixed(1) + "%</td></tr>").join("") +
    "</tbody></table></div></div></div>";

  // Per-property breakdown
  const pp = withCost.filter(x => x.s.allocation === "per_property").sort((a, b) => b.annual - a.annual);
  html += '<div class="card" style="margin-bottom:16px"><h3>Per-property tools</h3>' +
    '<p class="sub">These scale with the portfolio. Direct total: <b>' + fmt$(byAlloc.per_property) + "/yr</b> = <b>" +
    fmt$(byAlloc.per_property / 12 / props, 2) + " per property per month</b> across " + props + " units</p>" +
    '<div class="chart-wrap" id="anProp" style="margin-bottom:10px"></div>' +
    '<div style="overflow-x:auto"><table class="data"><thead><tr><th>Tool</th><th class="num">Annual</th><th class="num">Monthly</th><th class="num">$ / property / mo</th></tr></thead><tbody>' +
    pp.map(x => "<tr><td><b>" + esc(x.s.name) + '</b></td><td class="num">' + fmt$(x.annual) + '</td><td class="num">' + fmt$(x.annual / 12) + '</td><td class="num"><b>' + fmt$(x.annual / 12 / props, 2) + "</b></td></tr>").join("") +
    "</tbody></table></div></div>";

  // Per-user breakdown with inline seat editing
  const pu = withCost.filter(x => x.s.allocation === "per_user").sort((a, b) => b.annual - a.annual);
  html += '<div class="card" style="margin-bottom:16px"><h3>Per-user tools</h3>' +
    '<p class="sub">Seats are editable here — set the real seat count per tool; blank = company employee count (' + users + '). Direct total: <b>' +
    fmt$(byAlloc.per_user) + "/yr</b> = <b>" + fmt$(byAlloc.per_user / 12 / users, 2) + " avg per employee per month</b></p>" +
    '<div style="overflow-x:auto"><table class="data"><thead><tr><th>Tool</th><th class="num">Seats</th><th class="num">Annual</th><th class="num">Monthly</th><th class="num">$ / seat / mo</th></tr></thead><tbody>' +
    pu.map(x => {
      const seats = seatsFor(x.s);
      const manual = x.s.seat_count != null && x.s.seat_count > 0;
      return "<tr><td><b>" + esc(x.s.name) + "</b></td>" +
        '<td class="num"><input class="seat-inline" type="number" min="0" step="1" data-id="' + x.s.id + '" value="' + (manual ? x.s.seat_count : "") + '" placeholder="' + users + '">' +
        (manual ? "" : ' <span class="muted small" title="using company employee count">co.</span>') + "</td>" +
        '<td class="num">' + fmt$(x.annual) + '</td><td class="num">' + fmt$(x.annual / 12) + '</td>' +
        '<td class="num"><b>' + fmt$(x.annual / 12 / seats, 2) + "</b></td></tr>";
    }).join("") +
    "</tbody></table></div></div>";

  // Company-wide breakdown
  const cw = withCost.filter(x => x.s.allocation === "company_wide").sort((a, b) => b.annual - a.annual);
  html += '<div class="card"><h3>Company-wide tools</h3>' +
    '<p class="sub">Fixed overhead regardless of size. Total: <b>' + fmt$(byAlloc.company_wide) + "/yr</b> = <b>" +
    fmt$(byAlloc.company_wide / 12, 2) + "/mo</b>, a burden of <b>" + fmt$(byAlloc.company_wide / 12 / users, 2) + " per employee per month</b></p>" +
    '<div style="overflow-x:auto"><table class="data"><thead><tr><th>Tool</th><th>Dept</th><th class="num">Annual</th><th class="num">Monthly</th><th class="num">% of total tech</th></tr></thead><tbody>' +
    cw.map(x => "<tr><td><b>" + esc(x.s.name) + "</b></td><td class='muted'>" + esc(x.s.department) + '</td><td class="num">' + fmt$(x.annual) + '</td><td class="num">' + fmt$(x.annual / 12) + '</td><td class="num">' + (x.annual / total * 100).toFixed(1) + "%</td></tr>").join("") +
    "</tbody></table></div>" +
    '<p class="small muted">Subscriptions with no cost under this basis are hidden. Cancelled subscriptions are excluded.</p></div>';

  v.innerHTML = html;

  // charts
  const deptRows = Object.entries(deptMap).sort((a, b) => b[1] - a[1]);
  const top6 = deptRows.slice(0, 6).map(([k, val]) => ({ label: k, values: [val] }));
  const other = deptRows.slice(6).reduce((s, [, val]) => s + val, 0);
  if (other > 0) top6.push({ label: "Other", values: [other] });
  hBars(el("anDept"), top6, [{ name: "Annual cost", color: "var(--series-1)" }], { labelW: 150 });
  hBars(el("anProp"), pp.slice(0, 8).map(x => ({ label: x.s.name, values: [x.annual / 12 / props] })),
    [{ name: "$ / property / mo", color: "var(--series-1)" }], { labelW: 150 });

  // wiring
  el("basisSeg").querySelectorAll("button").forEach(b => b.addEventListener("click", () => { S.basis = b.dataset.b; renderAnalytics(); }));
  v.querySelectorAll("input.seat-inline").forEach(inp => {
    inp.addEventListener("change", async () => {
      const val = inp.value === "" ? null : Math.max(0, parseInt(inp.value, 10) || 0);
      try {
        await apiPatch("tc_subscriptions?id=eq." + inp.dataset.id, { seat_count: val });
        const sub = S.subs.find(s => s.id === inp.dataset.id);
        await logAct("seats_updated", (sub ? sub.name : inp.dataset.id) + " → " + (val == null ? "company count" : val + " seats"));
        await loadAll();
        renderAnalytics();
      } catch (e) { alert("Could not save seats: " + e.message); }
    });
  });
}
function allocRow(label, val, total, unit) {
  return "<tr><td><b>" + label + '</b></td><td class="num">' + fmt$(val) + '</td><td class="num">' + fmt$(val / 12) +
    '</td><td class="num">' + (total ? (val / total * 100).toFixed(1) : "0") + '%</td><td class="unit-econ">' + unit + "</td></tr>";
}
</script>
<script>
"use strict";
/* ================= DATA EXPLORER ================= */
function renderData() {
  const v = el("view-data");
  const act = committedActuals();
  let html = '<div class="toolbar">' +
    '<button class="btn" id="dxRegister">⬇ Register CSV</button>' +
    '<button class="btn" id="dxActuals">⬇ Monthly actuals CSV</button>' +
    '<button class="btn" id="dxFlags">⬇ Audit flags CSV</button>' +
    '<span class="small muted">Opens straight into Excel</span></div>';
  // pivot: rows = subs, cols = months
  const months = [...new Set(act.map(a => a.period_month))].sort();
  if (!months.length) {
    html += '<div class="card empty">No committed monthly numbers yet — the table fills in as monthly audits are committed.<br>The register itself is in the <b>Register</b> tab (and exportable above).</div>';
  } else {
    html += '<div class="card" style="padding:6px 8px;overflow-x:auto"><table class="data"><thead><tr><th>Subscription</th>' +
      months.map(m => '<th class="num">' + monthName(m) + "</th>").join("") + '<th class="num">Total</th></tr></thead><tbody>';
    const bySub = {};
    act.forEach(a => {
      const key = a.subscription_id || a.qb_account_code;
      (bySub[key] = bySub[key] || {})[a.period_month] = (bySub[key][a.period_month] || 0) + Number(a.amount);
    });
    const rows = Object.entries(bySub).map(([key, m]) => {
      const sub = S.subs.find(s => s.id === key);
      return { name: sub ? sub.name : key, m, total: Object.values(m).reduce((s, x) => s + x, 0) };
    }).sort((a, b) => b.total - a.total);
    rows.forEach(r => {
      html += "<tr><td><b>" + esc(r.name) + "</b></td>" +
        months.map(mo => '<td class="num">' + (r.m[mo] != null ? fmt$(r.m[mo], 2) : '<span class="muted">—</span>') + "</td>").join("") +
        '<td class="num"><b>' + fmt$(r.total, 2) + "</b></td></tr>";
    });
    const colTotals = months.map(mo => act.filter(a => a.period_month === mo).reduce((s, a) => s + Number(a.amount), 0));
    html += "<tr><td><b>Total</b></td>" + colTotals.map(t => '<td class="num"><b>' + fmt$(t, 2) + "</b></td>").join("") +
      '<td class="num"><b>' + fmt$(colTotals.reduce((s, x) => s + x, 0), 2) + "</b></td></tr>";
    html += "</tbody></table></div>";
  }
  // Activity log
  html += '<h3 style="margin-top:26px">Activity log</h3><div class="card" style="padding:6px 8px"><table class="data"><tbody>' +
    (S.log.length ? S.log.map(l => "<tr><td class='muted' style='white-space:nowrap'>" + new Date(l.at).toLocaleString() + "</td><td>" + esc(l.actor || "") + "</td><td>" + esc(l.action) + "</td><td class='muted'>" + esc(l.detail || "") + "</td></tr>").join("") : "<tr><td class='muted'>No activity yet</td></tr>") +
    "</tbody></table></div>";
  v.innerHTML = html;
  el("dxRegister").addEventListener("click", exportRegister);
  el("dxActuals").addEventListener("click", () => {
    downloadCSV("bnbbreeze-monthly-actuals.csv", ["month","qb_account_code","subscription","amount"],
      committedActuals().map(a => {
        const sub = S.subs.find(s => s.id === a.subscription_id);
        return [a.period_month.slice(0, 7), a.qb_account_code || "", sub ? sub.name : "", a.amount];
      }));
  });
  el("dxFlags").addEventListener("click", () => {
    downloadCSV("bnbbreeze-audit-flags.csv", ["created","subscription","type","severity","status","detail","resolution_note","resolved_by"],
      S.flags.map(f => {
        const sub = S.subs.find(s => s.id === f.subscription_id);
        return [f.created_at.slice(0, 10), sub ? sub.name : f.qb_account_code || "", f.flag_type, f.severity, f.status, f.detail || "", f.resolution_note || "", f.resolved_by || ""];
      }));
  });
}

/* ================= SETTINGS ================= */
function renderSettings() {
  const v = el("view-settings");
  const defs = [
    ["company_name", "Company name", "text"],
    ["property_count", "Active rental units (per-property math)", "number"],
    ["user_count", "Employees / seats (per-user math)", "number"],
    ["variance_threshold_pct", "Flag a price change bigger than (%)", "number"],
    ["budget_threshold_pct", "Flag when YTD exceeds (%) of prorated budget", "number"],
    ["fiscal_year", "Budget year", "number"]
  ];
  v.innerHTML = '<div class="card" style="max-width:560px"><h3 class="mt0">System settings</h3>' +
    defs.map(([k, label, type]) =>
      '<label style="display:block;font-size:12px;color:var(--text-secondary);margin:12px 0 4px">' + esc(label) + "</label>" +
      '<input data-k="' + k + '" type="' + type + '" value="' + esc(setting(k, "")) + '" style="width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--page);color:var(--text-primary)">'
    ).join("") +
    '<div class="actions" style="margin-top:16px;display:flex;gap:10px"><button class="btn primary" id="setSave">Save settings</button><span class="small muted" id="setMsg"></span></div></div>' +
    '<div class="card" style="max-width:560px;margin-top:16px"><h3 class="mt0">About this system</h3>' +
    '<p class="small" style="color:var(--text-secondary)">Data lives in the <b>techcosts</b> schema of the BNB Breeze Supabase project (Streamline Database). ' +
    "This dashboard file is self-contained — copy it, email it, or bookmark it; every copy talks to the same database. " +
    "Monthly workflow: QuickBooks export → Monthly Audit tab → review → commit. See the maintainer runbook for details.</p></div>";
  el("setSave").addEventListener("click", async () => {
    const inputs = v.querySelectorAll("input[data-k]");
    try {
      for (const inp of inputs) {
        await api("tc_settings?key=eq." + inp.dataset.k, { method: "PATCH", body: JSON.stringify({ value: inp.value }) });
      }
      await logAct("settings_updated", [...inputs].map(i => i.dataset.k + "=" + i.value).join(", "));
      el("setMsg").textContent = "Saved ✓";
      await loadAll();
    } catch (e) { el("setMsg").textContent = "Save failed: " + e.message; }
  });
}

/* ================= NAV & INIT ================= */
function go(view) {
  S.view = view;
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("active", b.dataset.view === view));
  document.querySelectorAll("section.view").forEach(s => s.classList.toggle("active", s.id === "view-" + view));
  render(view);
}
function render(view) {
  if (view === "overview") renderOverview();
  if (view === "analytics") renderAnalytics();
  if (view === "register") renderRegister();
  if (view === "audit") renderAudit();
  if (view === "data") renderData();
  if (view === "settings") renderSettings();
  const n = openFlags().length;
  const pill = el("flagPill");
  pill.style.display = n ? "inline-block" : "none";
  pill.textContent = n;
}
async function refresh() { await loadAll(); render(S.view); }
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => go(b.dataset.view)));
el("themeBtn").addEventListener("click", () => {
  const r = document.documentElement;
  const cur = r.getAttribute("data-theme");
  const sysDark = matchMedia("(prefers-color-scheme: dark)").matches;
  const next = cur ? (cur === "dark" ? "light" : "dark") : (sysDark ? "light" : "dark");
  r.setAttribute("data-theme", next);
  render(S.view);
});
addEventListener("resize", () => { clearTimeout(window.__rz); window.__rz = setTimeout(() => render(S.view), 200); });
(async function init() {
  try {
    await loadAll();
    el("wordmark").textContent = setting("company_name", "BNB Breeze");
    render("overview");
  } catch (e) {
    el("view-overview").innerHTML = '<div class="banner critical"><div><b>Could not reach the database.</b> Check your internet connection and that the Supabase project is active. Error: ' + esc(e.message) + "</div></div>";
  }
})();
</script>
</body>
</html>
